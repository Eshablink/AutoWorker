services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: autoworker
      POSTGRES_USER: autoworker
      POSTGRES_PASSWORD: autoworker
    ports: ["5432:5432"]
    volumes: [autoworker_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoworker -d autoworker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://autoworker:autoworker@postgres:5432/autoworker
      AUTOWORKER_ENV: development
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports: ["3000:80"]
    depends_on: [api]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://autoworker:autoworker@postgres:5432/autoworker
      AUTOWORKER_ENV: development
      REDIS_URL: redis://redis:6379/0
      AUTOWORKER_WORKER_ID: compose-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  autoworker_pgdata:

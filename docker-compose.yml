services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: autoworker
      POSTGRES_USER: autoworker
      POSTGRES_PASSWORD: autoworker
    ports:
      - "5432:5432"
    volumes:
      - autoworker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoworker -d autoworker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autoworker_pgdata:

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoworker"
version = "0.1.0"
description = "Autonomous AI computer worker engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.17,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.38,<1",
    "prometheus-client>=0.23,<1",
    "redis>=5.2,<8",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
]
browser = [
    "playwright>=1.50,<2",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

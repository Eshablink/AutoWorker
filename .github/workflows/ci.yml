name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoworker
          POSTGRES_PASSWORD: autoworker
          POSTGRES_DB: autoworker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoworker -d autoworker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker
        run: alembic upgrade head
      - name: Validate legacy approval migration
        env:
          DATABASE_URL: postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker
        run: |
          alembic downgrade 0001_initial
          python - <<'PY'
          import json
          from sqlalchemy import create_engine, text

          engine = create_engine(
              "postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker"
          )
          legacy = {
              "created_at": "2026-01-01T00:00:00Z",
              "actions": [{
                  "approval_request": {
                      "approval_id": "11111111-1111-1111-1111-111111111111",
                      "action_id": "22222222-2222-2222-2222-222222222222",
                      "policy_decision_id": "33333333-3333-3333-3333-333333333333",
                      "status": "PENDING",
                      "tool_id": "erp_submit",
                      "risk_level": "HIGH",
                      "expires_at": "2026-01-01T00:15:00Z",
                      "created_at": "2026-01-01T00:00:00Z",
                      "decided_at": None,
                  }
              }],
          }
          with engine.begin() as connection:
              connection.execute(
                  text(
                      "INSERT INTO tasks (task_id, version, payload) "
                      "VALUES (:task_id, 1, CAST(:payload AS JSON))"
                  ),
                  {"task_id": "44444444-4444-4444-4444-444444444444", "payload": json.dumps(legacy)},
              )
          PY
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine(
              "postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker"
          )
          with engine.connect() as connection:
              row = connection.execute(
                  text(
                      "SELECT task_id, status FROM approval_requests "
                      "WHERE approval_id = '11111111-1111-1111-1111-111111111111'"
                  )
              ).one_or_none()
          assert row is not None, "Legacy approval was not backfilled."
          assert str(row.status) == "PENDING"
          assert str(row.task_id) == "44444444-4444-4444-4444-444444444444"
          PY
      - run: pytest -q
      - run: ruff check packages apps tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run build


  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoworker
          POSTGRES_PASSWORD: autoworker
          POSTGRES_DB: autoworker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoworker -d autoworker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Run controlled browser E2E
        env:
          DATABASE_URL: postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker
        run: |
          alembic upgrade head
          pytest -q tests/e2e


  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run Redis Streams integration
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -q tests/integration/test_redis_broker.py


name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoworker
          POSTGRES_PASSWORD: autoworker
          POSTGRES_DB: autoworker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoworker -d autoworker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker
        run: alembic upgrade head
      - name: Validate legacy approval migration
        env:
          DATABASE_URL: postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker
        run: |
          alembic downgrade 0001_initial
          python - <<'PY'
          import json
          from sqlalchemy import create_engine, text

          engine = create_engine(
              "postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker"
          )
          legacy = {
              "created_at": "2026-01-01T00:00:00Z",
              "actions": [{
                  "approval_request": {
                      "approval_id": "11111111-1111-1111-1111-111111111111",
                      "action_id": "22222222-2222-2222-2222-222222222222",
                      "policy_decision_id": "33333333-3333-3333-3333-333333333333",
                      "status": "PENDING",
                      "tool_id": "erp_submit",
                      "risk_level": "HIGH",
                      "expires_at": "2026-01-01T00:15:00Z",
                      "created_at": "2026-01-01T00:00:00Z",
                      "decided_at": None,
                  }
              }],
          }
          with engine.begin() as connection:
              connection.execute(
                  text(
                      "INSERT INTO tasks (task_id, version, payload) "
                      "VALUES (:task_id, 1, CAST(:payload AS JSON))"
                  ),
                  {"task_id": "44444444-4444-4444-4444-444444444444", "payload": json.dumps(legacy)},
              )
          PY
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine(
              "postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker"
          )
          with engine.connect() as connection:
              row = connection.execute(
                  text(
                      "SELECT task_id, status FROM approval_requests "
                      "WHERE approval_id = '11111111-1111-1111-1111-111111111111'"
                  )
              ).one_or_none()
          assert row is not None, "Legacy approval was not backfilled."
          assert str(row.status) == "PENDING"
          assert str(row.task_id) == "44444444-4444-4444-4444-444444444444"
          PY
      - name: Run backend tests
        env:
          AUTOWORKER_ENV: development
        run: pytest -q
      - run: ruff check packages apps tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoworker
          POSTGRES_PASSWORD: autoworker
          POSTGRES_DB: autoworker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoworker -d autoworker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Run controlled browser E2E
        env:
          DATABASE_URL: postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker
        run: |
          alembic upgrade head
          pytest -q tests/e2e

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run Redis Streams integration
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -q tests/integration/test_redis_broker.py

  live-demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the deployed demo API
        env:
          API_URL: https://autoworker-api-demo.onrender.com
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "${API_URL}/system/status"
          deadline = time.time() + 180
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      payload = response.read().decode()
                      if response.status == 200 and '"execution":' in payload:
                          print(f"Demo API is live: {payload}")
                          break
              except Exception as exc:
                  print(f"Waiting for demo API: {exc}")
              time.sleep(10)
          else:
              raise SystemExit("Demo API did not expose runtime status within 180 seconds.")
          PY
      - name: Create and verify a real deployed task
        env:
          API_URL: https://autoworker-api-demo.onrender.com
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "${API_URL}"
          payload = json.dumps({
              "goal": "Process invoice INV-LIVE-SMOKE total 250 INR"
          }).encode()

          def create_task():
              request = urllib.request.Request(
                  f"{base}/tasks",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  assert response.status == 201, response.status
                  return json.load(response)

          task = create_task()
          task_id = task["task_id"]
          print(f"Created deployed task {task_id} with status {task['status']}.")

          deadline = time.time() + 120
          last = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(
                      f"{base}/tasks/{task_id}/detail", timeout=20
                  ) as response:
                      detail = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      # Render may still be switching instances after a deploy.
                      # Recreate the task so the smoke test only proceeds against
                      # an instance that serves the current task-detail route.
                      time.sleep(5)
                      task = create_task()
                      task_id = task["task_id"]
                      print(f"Retried against deployed instance with task {task_id}.")
                      continue
                  raise
              last = detail
              print(
                  f"status={detail['status']} "
                  f"step={detail['current_step_index']} "
                  f"verified={detail['verification_result']}"
              )
              if detail["status"] == "COMPLETED":
                  assert detail["verification_result"]["success"] is True
                  assert detail["actions"][0]["tool_output"]["status"] == "POSTED"
                  print("Live demo task completed and verified.")
                  break
              if detail["status"] in {"FAILED", "CANCELLED"}:
                  raise SystemExit(f"Live task failed: {detail}")
              time.sleep(5)
          else:
              raise SystemExit(f"Live task did not complete: {last}")
          PY

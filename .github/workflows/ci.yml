name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoworker
          POSTGRES_PASSWORD: autoworker
          POSTGRES_DB: autoworker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoworker -d autoworker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Validate PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://autoworker:autoworker@127.0.0.1:5432/autoworker
        run: alembic upgrade head
      - run: pytest -q
      - run: ruff check packages apps tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run build
